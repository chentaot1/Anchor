name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['android-v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ${{ github.workspace }}/app/.cxx
            ${{ github.workspace }}/.cache/fetchcontent
          key: ${{ runner.os }}-anchor-${{ hashFiles('**/gradle-wrapper.properties', 'app/build.gradle.kts', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-anchor-

      - name: Run tests
        env:
          CMAKE_FETCHCONTENT_CACHE_DIR: ${{ github.workspace }}/.cache/fetchcontent
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace

  release:
    name: Build & Release APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/android-v') && vars.ANCHOR_ANDROID_CI_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ${{ github.workspace }}/app/.cxx
            ${{ github.workspace }}/.cache/fetchcontent
          key: ${{ runner.os }}-anchor-${{ hashFiles('**/gradle-wrapper.properties', 'app/build.gradle.kts', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-anchor-

      - name: Bundle verified desktop model
        run: python3 tools/fetch_desktop_model.py

      - name: Restore persistent Android signing key
        env:
          ANCHOR_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANCHOR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get("ANCHOR_ANDROID_KEYSTORE_BASE64")
          if not encoded:
              raise SystemExit("Missing persistent signing key; refusing to publish with a new random key")
          target = Path.home() / ".android" / "debug.keystore"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded, validate=True))
          target.chmod(0o600)
          PY

      - name: Build APK
        env:
          CMAKE_FETCHCONTENT_CACHE_DIR: ${{ github.workspace }}/.cache/fetchcontent
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Verify packaged desktop model and ARM64 runtime
        run: python3 tools/verify_android_apk.py

      - name: Rename APK
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          cp app/build/outputs/apk/debug/app-debug.apk "anchor-adhd-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/releases/android-${{ steps.package.outputs.version }}.md
          name: Android ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-preview.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
          files: anchor-adhd-*.apk
